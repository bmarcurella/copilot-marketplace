name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate marketplace, plugins, and skills
        run: node scripts/validate.mjs

      - name: Check demo-architect references are in sync
        run: node scripts/sync-cowork-references.mjs --check

      - name: Install Microsoft 365 Agents Toolkit CLI
        run: npm install -g @microsoft/m365agentstoolkit-cli@1

      - name: Validate Cowork manifests against the M365 schema
        run: node scripts/validate-cowork-schema.mjs
